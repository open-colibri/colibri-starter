name: Publish the documentation

# Asks the website (https://github.com/the-swan-foundation/starter), which builds and serves the documentation
# website (https://github.com/the-swan-foundation/the-swan-starter-docs), to redeploy, so that
# https://the-swan-foundation.github.io/starter/docs/ follows the docs/ folder of main.
#
# Requires a DOCS_DISPATCH_TOKEN secret: a token allowed to create repository
# dispatch events (contents: write) on the-swan-foundation/starter.

"on":
    push:
        branches: ["main"]
        paths: ["docs/**"]
    workflow_dispatch: ~

permissions:
    contents: read

jobs:
    dispatch:
        name: Redeploy the website and its documentation
        runs-on: ubuntu-latest
        steps:
            - name: Send the docs-updated event
              env:
                  GH_TOKEN: ${{ secrets.DOCS_DISPATCH_TOKEN }}
              run: |
                  curl --fail-with-body -sS -X POST \
                      -H "Accept: application/vnd.github+json" \
                      -H "Authorization: Bearer ${GH_TOKEN}" \
                      https://api.github.com/repos/the-swan-foundation/starter/dispatches \
                      -d '{"event_type": "docs-updated"}'
